# test/api-tests/tests/*/*.cases.mjs mediante funciones register*Tests().
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S2187
sonar.issue.ignore.multicriteria.e1.resourceKey=test/api-tests/tests/api.test.mjs
