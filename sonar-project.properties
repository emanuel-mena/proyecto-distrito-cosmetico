sonar.projectKey=emanuel-mena_proyecto-distrito-cosmetico
sonar.organization=emanuel-mena
sonar.projectName=proyecto-distrito-cosmetico

sonar.sources=src,distrito-cosmetico-frontend/src
sonar.tests=test
sonar.test.inclusions=test/unit/**,test/api-tests/**
sonar.exclusions=**/node_modules/**,public/**,reports/**,distrito-cosmetico-frontend/public/**,distrito-cosmetico-frontend/dist/**,src/seed/**
sonar.coverage.exclusions=distrito-cosmetico-frontend/**,scripts/**,test/**
sonar.cpd.exclusions=test/**

sonar.javascript.lcov.reportPaths=reports/unit/lcov.info,reports/api/coverage/lcov.info
sonar.sourceEncoding=UTF-8

